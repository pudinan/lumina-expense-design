<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Lumina Expense — Latest</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { height:100%; }
  body { font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; background:#faf9f5; color:#222; display:flex; flex-direction:column; }
  header { background:#fff; border-bottom:1px solid #e5e5e5; padding:0 32px; display:flex; align-items:center; gap:32px; flex:0 0 auto; box-shadow:0 1px 3px rgba(0,0,0,.04); }
  .brand { display:flex; align-items:center; gap:12px; padding:16px 0; border-right:1px solid #e5e5e5; padding-right:32px; }
  .brand-mark { width:32px; height:32px; border-radius:8px; background:linear-gradient(135deg,#529bc9 0%,#26587e 100%); display:flex; align-items:center; justify-content:center; color:#fff; font-weight:600; font-size:14px; }
  .brand-text { display:flex; flex-direction:column; }
  .brand-text .name { font-size:15px; font-weight:600; line-height:1.2; }
  .brand-text .tag { font-size:11px; color:#888; line-height:1.2; }
  nav { display:flex; gap:4px; }
  nav button { background:transparent; border:0; padding:20px 16px; font:500 14px/1 inherit; color:#666; cursor:pointer; border-bottom:2px solid transparent; transition:color .15s, border-color .15s; display:flex; align-items:center; gap:8px; }
  nav button:hover { color:#222; }
  nav button.active { color:#26587e; border-bottom-color:#529bc9; font-weight:600; }
  nav button .icon { font-size:18px; }
  .grow { flex:1; }
  .meta { font-size:12px; color:#999; padding:0 16px; }
  main { flex:1; min-height:0; display:flex; }
  iframe { flex:1; border:0; background:#fff; }
</style>
</head>
<body>

<header>
  <div class="brand">
    <div class="brand-mark">L</div>
    <div class="brand-text">
      <div class="name">Lumina Expense</div>
      <div class="tag">Terra TDV · 3 pages · latest</div>
    </div>
  </div>
  <nav>
    <button class="active" data-src="/latest/desktop.html"><span class="icon">🖥</span>Desktop</button>
    <button data-src="/latest/mobile.html"><span class="icon">📱</span>Mobile</button>
    <button data-src="/latest/employee-policy.html"><span class="icon">👤</span>Employee · Expense Policy</button>
  </nav>
  <div class="grow"></div>
  <div class="meta">3 pages · standalone · self-contained</div>
</header>

<main>
  <iframe id="frame" src="/latest/desktop.html"></iframe>
</main>

<script>
  const nav = document.querySelectorAll('nav button');
  const frame = document.getElementById('frame');
  nav.forEach(b => b.addEventListener('click', () => {
    nav.forEach(x => x.classList.remove('active'));
    b.classList.add('active');
    frame.src = b.dataset.src;
  }));
</script>

</body>
</html>
